<text x="14.00" y="193.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• 1 sheet of A4 (or Letter) paper</text>
<text x="14.00" y="198.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• The fold sheet, printed on both sides</text>
<text x="14.00" y="203.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• A flat table (and a tray of water!)</text>
<text x="14.00" y="208.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• A grown-up nearby for the water</text>
<rect x="108.00" y="181.00" width="92.00" height="32.00" fill="#FFFFFF" stroke="#FDE68A" stroke-width="0.45" rx="2"/>
<text x="112.00" y="187.00" font-size="3.2" text-anchor="start" fill="#B45309" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">Maths / coding link</text>
<text x="112.00" y="193.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">Fold in half: ½. Find the middle: ¼.</text>
<text x="112.00" y="198.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">The “open to a diamond” move happens</text>
<text x="112.00" y="203.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">TWICE (steps 11 and 15). Doing the</text>
<text x="112.00" y="208.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">same moves again is a LOOP!</text>
<rect x="10.00" y="218.00" width="190.00" height="40.00" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="0.45" rx="2"/>
<text x="16.00" y="225.00" font-size="3.4" text-anchor="start" fill="#0369A1" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">Float your boat</text>
<text x="18.00" y="231.50" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">1. Open the bottom of the boat a little so it sits flat (step 17).</text>
<text x="18.00" y="237.50" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">2. Put it gently on a tray or bath of water — with a grown-up nearby.</text>
<text x="18.00" y="243.50" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">3. Blow on the sail! Paper gets soggy, so race fast and fold a new one.</text>
<text x="18.00" y="249.50" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">Try it: does a thicker paper float longer? Change ONE thing and test again.</text>
