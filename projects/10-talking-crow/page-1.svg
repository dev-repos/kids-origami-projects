<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<rect width="210" height="297" fill="#F1F5F9"/>
<rect x="10.00" y="8.00" width="190.00" height="18.00" fill="#4F5D8C" stroke="#4F5D8C" stroke-width="0" rx="2"/>
<text x="105.00" y="16.00" font-size="3.6" text-anchor="middle" fill="#fff" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">Origami for Kids  ·  Project #10  ·  Talking Crow  ·  page 1/3 (1:1 scale)</text>
<text x="105.00" y="22.50" font-size="3.0" text-anchor="middle" fill="#E0E7FF" font-family="DejaVu Sans,Arial,sans-serif">PRINT AT 100% / ACTUAL SIZE  —  Do NOT “fit to page”</text>
<text x="105.00" y="36.00" font-size="7" text-anchor="middle" fill="#1E1060" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">Fold a Talking Crow</text>
<text x="105.00" y="41.00" font-size="2.7" text-anchor="middle" fill="#64748B" font-family="DejaVu Sans,Arial,sans-serif">Ages 8+  ·  ~15 minutes  ·  Square 150 × 150 mm  ·  Coding idea: input → output</text>
<text x="105.00" y="47.50" font-size="3.0" text-anchor="middle" fill="#1E1060" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">True-size square  150 × 150 mm  (cut from A4 if needed)</text>
