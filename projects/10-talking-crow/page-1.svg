<rect x="109.00" y="111.00" width="43.00" height="5.00" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="110.00" y="114.60" font-size="2.8" text-anchor="start" fill="#2563EB" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">step 1: the middle line</text>
<rect x="122.00" y="162.00" width="40.00" height="5.00" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="123.00" y="165.60" font-size="2.8" text-anchor="start" fill="#2563EB" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">step 2: kite folds</text>
<rect x="48.00" y="72.00" width="46.00" height="5.00" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="49.00" y="75.60" font-size="2.8" text-anchor="start" fill="#2563EB" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">step 3: diamond folds</text>
<text x="105.00" y="205.00" font-size="2.4" text-anchor="middle" fill="#475569" font-family="DejaVu Sans,Arial,sans-serif">Turn the square like a diamond, blue side down — the middle line runs from the far corner to you.</text>
<line x1="30.00" y1="209.00" x2="180.00" y2="209.00" stroke="#DC2626" stroke-width="0.3" stroke-linecap="round"/>
<text x="105.00" y="213.00" font-size="2.8" text-anchor="middle" fill="#DC2626" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">150 mm</text>
<rect x="10.00" y="217.00" width="190.00" height="20.00" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.45" rx="2"/>
<text x="16.00" y="223.00" font-size="3.2" text-anchor="start" fill="#1E1060" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">Symbol key</text>
<line x1="16.00" y1="229.00" x2="36.00" y2="229.00" stroke="#2563EB" stroke-width="0.7" stroke-dasharray="3 2" stroke-linecap="round"/>
<text x="38.00" y="230.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">Valley (fold toward you)</text>
<line x1="95.00" y1="229.00" x2="115.00" y2="229.00" stroke="#DC2626" stroke-width="0.7" stroke-dasharray="2.5 1.2 0.6 1.2" stroke-linecap="round"/>
<text x="117.00" y="230.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">Mountain (fold away)</text>
<text x="16.00" y="234.50" font-size="2.5" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">→ Fold arrow     ↩ Fold and open again     ✓ Check the shape     ⇄ Pull apart / push together</text>
<rect x="10.00" y="240.00" width="92.00" height="27.00" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.45" rx="2"/>
<text x="14.00" y="246.00" font-size="3.2" text-anchor="start" fill="#059669" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">You need</text>
<text x="14.00" y="252.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• 1 square paper 150 mm (thin is best)</text>
<text x="14.00" y="257.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• Or print the fold sheet, both sides</text>
<text x="14.00" y="262.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• A pen for the eyes (plain paper)</text>
<rect x="108.00" y="240.00" width="92.00" height="27.00" fill="#FFFFFF" stroke="#FDE68A" stroke-width="0.45" rx="2"/>
<text x="112.00" y="246.00" font-size="3.2" text-anchor="start" fill="#B45309" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">Coding link</text>
<text x="112.00" y="252.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">Your hands give the INPUT: pull or push.</text>
<text x="112.00" y="257.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">The beak is the OUTPUT: open or shut.</text>
<text x="112.00" y="262.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">Same input → same output, every time.</text>
