<text x="117.00" y="230.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">Mountain (fold away)</text>
<text x="16.00" y="234.50" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">↻ Turn over     → Fold arrow     ✓ Check silhouette     ★ Finished cup</text>
<rect x="10.00" y="240.00" width="92.00" height="27.00" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="0.45" rx="2"/>
<text x="14.00" y="246.00" font-size="3.2" text-anchor="start" fill="#059669" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">You need</text>
<text x="14.00" y="252.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• 1 square paper 150 mm</text>
<text x="14.00" y="257.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• Clean hands  ·  Flat table</text>
<text x="14.00" y="262.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• Optional: cup of water to test!</text>
<rect x="108.00" y="240.00" width="92.00" height="27.00" fill="#FFFFFF" stroke="#FDE68A" stroke-width="0.45" rx="2"/>
<text x="112.00" y="246.00" font-size="3.2" text-anchor="start" fill="#B45309" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">Coding / maths link</text>
<text x="112.00" y="252.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">An algorithm is a list of steps</text>
<text x="112.00" y="257.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">in order. Skip a fold and the</text>
<text x="112.00" y="262.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">cup fails — just like a bug!</text>
