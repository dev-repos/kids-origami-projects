<text x="117.00" y="171.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">Mountain (fold away, to the back)</text>
<text x="16.00" y="175.50" font-size="2.5" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">↻ Turn over     → Fold arrow     ✓ Check the shape     ● pick up here     ◌ put it here</text>
