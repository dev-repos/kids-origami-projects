<text x="14.00" y="193.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• 1 sheet of A4 (or Letter) paper</text>
<text x="14.00" y="198.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• The fold sheet, printed on both sides</text>
<text x="14.00" y="203.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• A flat table to fold on</text>
<text x="14.00" y="208.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• Space to throw — never at people!</text>
<rect x="108.00" y="181.00" width="92.00" height="32.00" fill="#FFFFFF" stroke="#FDE68A" stroke-width="0.45" rx="2"/>
<text x="112.00" y="187.00" font-size="3.2" text-anchor="start" fill="#B45309" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">Maths / coding link</text>
<text x="112.00" y="193.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">The middle line is a line of SYMMETRY:</text>
<text x="112.00" y="198.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">every fold on the left is copied on the</text>
<text x="112.00" y="203.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">right. Each corner fold HALVES the angle:</text>
<text x="112.00" y="208.00" font-size="2.6" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">90° → 45° → 22.5° — a sharp nose!</text>
<rect x="10.00" y="218.00" width="190.00" height="40.00" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="0.45" rx="2"/>
<text x="16.00" y="225.00" font-size="3.4" text-anchor="start" fill="#0369A1" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">Fly your plane</text>
<text x="18.00" y="231.50" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">1. Open the wings so they are flat and level — a T from the front (step 11).</text>
<text x="18.00" y="237.50" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">2. Hold the body underneath, aim a little up, and push it gently forward.</text>
<text x="18.00" y="243.50" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">3. Nose dives? Bend the back edges of the wings up a tiny bit.</text>
<text x="18.00" y="249.50" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">Test it like a coder: change ONE thing, throw 3 times, measure how far it flew.</text>
