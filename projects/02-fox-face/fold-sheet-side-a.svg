<text x="15.00" y="199.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.8" text-anchor="start" fill="#334155">1. A grown-up helps cut out the square on the dotted line.</text>
<text x="15.00" y="204.20" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.8" text-anchor="start" fill="#334155">2. Start with side A up. Turn it like a diamond with the TOP corner (dot 1) pointing away, then fold it down.</text>
<text x="15.00" y="209.40" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.8" text-anchor="start" fill="#334155">3. Follow the numbers: fold on the line with the same number as the step.</text>
<text x="15.00" y="214.60" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.8" text-anchor="start" fill="#334155">4. Orange dot = the corner you pick up. Dotted ring = where it lands.</text>
<text x="15.00" y="219.80" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.8" text-anchor="start" fill="#334155">5. After you turn the paper over, the lines are printed on that side too.</text>
