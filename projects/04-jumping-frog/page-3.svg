<text x="16.00" y="101.00" font-size="3.4" text-anchor="start" fill="#1E1060" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">How to make it jump</text>
<text x="18.00" y="107.00" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">1. Put the frog on a smooth table, eyes up.</text>
<text x="18.00" y="113.00" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">2. Put one finger on the back edge (the spring).</text>
<text x="18.00" y="119.00" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">3. Push down a little so the spring squashes.</text>
<text x="18.00" y="125.00" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">4. Slide your finger off the back — it springs up and hops!</text>
<rect x="10.00" y="132.00" width="190.00" height="27.00" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="0.45" rx="2"/>
<text x="16.00" y="139.00" font-size="3.4" text-anchor="start" fill="#1E1060" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">It won’t jump?</text>
<text x="18.00" y="145.00" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• Crease the zig-zag harder (steps 6 and 7).</text>
<text x="18.00" y="151.00" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• Use thicker paper — an index card cut square is great.</text>
<text x="18.00" y="157.00" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">• Press only the very back edge, then slide off fast.</text>
<rect x="10.00" y="164.00" width="190.00" height="27.00" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="0.45" rx="2"/>
<text x="16.00" y="171.00" font-size="3.4" text-anchor="start" fill="#1E1060" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">Why does it jump?</text>
<text x="18.00" y="177.00" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">Squashing the zig-zag STORES energy, like a coiled spring.</text>
<text x="18.00" y="183.00" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">Your sliding finger is the TRIGGER — an event.</text>
<text x="18.00" y="189.00" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">The jump is the ACTION. In code: when pressed → jump!</text>
<rect x="10.00" y="196.00" width="190.00" height="22.00" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.45" rx="2"/>
<text x="16.00" y="203.00" font-size="3.4" text-anchor="start" fill="#B45309" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">Frog race!</text>
<text x="18.00" y="209.00" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">Fold two frogs and line them up. Which one jumps further?</text>
<text x="18.00" y="214.50" font-size="2.8" text-anchor="start" fill="#334155" font-family="DejaVu Sans,Arial,sans-serif">Change ONE thing (paper, spring size) and test again — that is debugging!</text>
